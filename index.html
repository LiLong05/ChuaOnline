  c.fillStyle='#120804';c.fillRect(0,0,bg.width,bg.height);c.setTransform(sc,0,0,sc,ox,oy);c.save();c.beginPath();c.rect(0,0,W,H);c.clip();drawBG(c);c.restore();
}

/* ---------- hiệu ứng động ---------- */
const sm=[],inc=[],fl=[],lm=[],sky=[],bows={},now=()=>performance.now()/1000;let incN=0,flN=0,lmN=0;
const FLM=[[150,458],[610,458],[320,486],[440,486]];
const cranes=[0,1,2].map(i=>({x:i*260,y:330+i*120,v:26+i*11,p:i}));
function puff(x,y){sm.push({x,y,a:.45,d:Math.random()*6.28,y0:y})}
function dyn(c,t,dt){
  FLM.forEach(([x,y],i)=>{const f=1+Math.sin(t*14+i*2)*.12+Math.sin(t*23+i)*.07;
    const g=c.createRadialGradient(x,y,2,x,y,46);g.addColorStop(0,'rgba(255,200,90,.5)');g.addColorStop(1,'rgba(255,180,60,0)');c.fillStyle=g;c.fillRect(x-46,y-46,92,92);
    E(c,x,y+2,4*f,9*f,'#ff9a20');E(c,x,y+3,2.2*f,5.5*f,'#fff0a0')});
  if(Math.random()<.3)puff(380+(Math.random()-.5)*20,464);
  inc.forEach(o=>{if(t-o.t>90)return;const tx=o.x+(o.x-CX)*.3;c.strokeStyle='#a01a10';c.lineWidth=2;c.beginPath();c.moveTo(o.x,508);c.lineTo(tx,456);c.stroke();E(c,tx,456,2.6,2.6,'#ff8a30');if(Math.random()<.12)puff(tx,452)});
  for(let i=sm.length-1;i>=0;i--){const p=sm[i];p.y-=.5;p.x+=Math.sin(p.y*.05+p.d)*.35;p.a-=.005;if(p.a<=0){sm.splice(i,1);continue}c.fillStyle='rgba(240,232,220,'+(p.a*.5).toFixed(3)+')';c.beginPath();c.arc(p.x,p.y,3+(p.y0-p.y)*.05,0,7);c.fill()}
  fl.forEach(o=>{if(t-o.t>90)return;E(c,o.x,640,14,5,'#d9a931');flower(c,o.x,636,1.2)});
  lm.forEach(o=>{if(t-o.t>90)return;const f=1+Math.sin(t*12+o.x)*.1;E(c,o.x,650,9,4,'#c9993a');E(c,o.x,641,4*f,8*f,'rgba(255,170,50,.45)');E(c,o.x,643,2.2*f,5*f,'#ffe9a0')});
}
function person(c,i,p,t){
  const q=S[i],k=q.s,x=q.x,y=q.y,h=hs(p.n),bw=bows[p.n]>t?Math.sin((bows[p.n]-t)/1.6*Math.PI):0;
  const b=(p.a?Math.sin(t*5+i)*1.2*k:Math.sin(t*1.4+i)*.5*k)+bw*9*k;
  const robe=p.h?'#e0a020':['#6f8aa3','#c9a37a','#9aa89a','#d8c8d0','#8fb0c8'][h%5];

  c.fillStyle=robe;c.beginPath();c.moveTo(x-22*k,y-4*k+b);c.bezierCurveTo(x-26*k,y-28*k+b,x-23*k,y-42*k+b,x-10*k,y-48*k+b);c.lineTo(x+10*k,y-48*k+b);c.bezierCurveTo(x+23*k,y-42*k+b,x+26*k,y-28*k+b,x+22*k,y-4*k+b);c.closePath();c.fill();
  if(p.h){c.fillStyle='#a3201a';c.beginPath();c.moveTo(x-10*k,y-48*k+b);c.lineTo(x+10*k,y-48*k+b);c.lineTo(x+24*k,y-16*k+b);c.lineTo(x+22*k,y-4*k+b);c.lineTo(x-22*k,y-4*k+b);c.lineTo(x-23*k,y-28*k+b);c.fill();
    c.strokeStyle='#e8c050';c.lineWidth=k;for(let j=0;j<5;j++){c.beginPath();c.moveTo(x-18*k+j*8*k,y-42*k+b+j*7*k);c.lineTo(x+20*k,y-8*k+b);c.stroke()}}
  c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=k;c.beginPath();c.moveTo(x,y-48*k+b);c.lineTo(x,y-6*k+b);c.stroke();
  R(c,x-4*k,y-54*k+b,8*k,7*k,'#d9a47c');
  if(p.h){E(c,x,y-61*k+b,11*k,11.5*k,'#e8b98f');E(c,x-3.5*k,y-65*k+b,3.4*k,2*k,'rgba(255,255,255,.35)')}
  else{E(c,x,y-61*k+b,11*k,11.5*k,'#241810');E(c,x-11*k,y-59*k+b,2*k,3*k,'#d9a47c');E(c,x+11*k,y-59*k+b,2*k,3*k,'#d9a47c');if(h%3===0)E(c,x,y-73*k+b,5*k,4.5*k,'#241810')}
}
function pill(c,txt,x,y,fs,col,av){
  c.font='bold '+fs+'px system-ui,sans-serif';const w=c.measureText(txt).width+14+(av?fs+2:0);
  c.fillStyle='rgba(25,8,3,.78)';c.beginPath();c.roundRect?c.roundRect(x-w/2,y-fs,w,fs+8,(fs+8)/2):c.rect(x-w/2,y-fs,w,fs+8);c.fill();
  let tx=x;if(av){E(c,x-w/2+fs/2+5,y-fs/2+4,fs/2-1,fs/2-1,'hsl('+(hs(txt)%360)+',55%,50%)');tx=x+fs/2+3}
  c.fillStyle=col;c.textAlign='center';c.fillText(txt,tx,y+1);
}
function crane(c,cr,t){const w=Math.sin(t*5+cr.p)*.9;c.save();c.translate(cr.x,cr.y+Math.sin(t*1.5+cr.p)*5);c.globalAlpha=.92;c.fillStyle='#f4f1ea';
  c.beginPath();c.moveTo(0,0);c.lineTo(-20,-12*w-4);c.lineTo(-6,4);c.fill();c.beginPath();c.moveTo(0,0);c.lineTo(20,-12*w-4);c.lineTo(6,4);c.fill();
  E(c,0,2,8,3.5,'#fff');c.strokeStyle='#f4f1ea';c.lineWidth=2;c.beginPath();c.moveTo(7,1);c.lineTo(16,-4);c.stroke();E(c,17,-5,2.2,2.2,'#d33');c.restore()}
const taken=i=>Object.values(remote).some(p=>p&&p.s===i);
let hover=-1;const nb={};
function beat(key,p,t,isMe){if(!p.a||t<(nb[key]||0))return;nb[key]=t+(p.a==='n'?1:1.15);if(isMe){mo(.3);if(p.a==='n')spin(STEP)}else if(p.h)mo(.1)}

/* ---------- vòng lặp ---------- */
let lastT=0;
function frame(ms){
  requestAnimationFrame(frame);const t=ms/1000,dt=Math.min(t-lastT,.1);lastT=t;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);ctx.setTransform(sc,0,0,sc,ox,oy);
  const c=ctx;dyn(c,t,dt);
  const occ={};
  if(started){if(me.s>=0)occ[me.s]={p:me,me:1};for(const k in remote){const p=remote[k];if(p&&Number.isInteger(p.s)&&S[p.s])occ[p.s]={p,me:0}}}
  beat('me',me,t,true);for(const k in remote)if(remote[k])beat(k,remote[k],t,false);
  S.forEach((q,i)=>{if(occ[i]){cushion(c,i,true);person(c,i,occ[i].p,t)}
    if(hover===i&&!occ[i]&&started){c.strokeStyle='rgba(255,230,140,.95)';c.lineWidth=2.5;c.setLineDash([5,4]);c.beginPath();c.ellipse(q.x,q.y-3*q.s,32*q.s,14*q.s,0,0,7);c.stroke();c.setLineDash([])}});
  for(const i in occ){const q=S[i],o=occ[i],p=o.p,k=q.s,fs=k>.9?17:15,hy=q.y-78*k;
    pill(c,(p.h?'🙏 ':'')+String(p.n).slice(0,20)+(o.me?' (bạn)':''),q.x,hy,fs,p.h?'#ffd36b':'#fff',1);
    if(p.a)pill(c,p.a==='n'?'Nam mô A Di Đà Phật':'Đang tụng kinh…',q.x,hy-fs-12,fs,'#ffe9a8')}
  cranes.forEach(cr=>{cr.x+=cr.v*dt;if(cr.x>W+30)cr.x=-30;crane(c,cr,t)});
  for(let i=sky.length-1;i>=0;i--){const o=sky[i];o.y-=22*dt;o.x+=Math.sin(t+o.t)*.2;if(o.y<20){sky.splice(i,1);continue}
    c.globalAlpha=Math.min(1,(o.y-20)/200);const g=c.createRadialGradient(o.x,o.y,2,o.x,o.y,38);g.addColorStop(0,'rgba(255,170,60,.55)');g.addColorStop(1,'rgba(255,170,60,0)');c.fillStyle=g;c.fillRect(o.x-38,o.y-38,76,76);
    c.fillStyle=LG(c,0,o.y-14,0,o.y+14,['#ffcf6a','#e8601c']);c.beginPath();c.roundRect?c.roundRect(o.x-9,o.y-13,18,26,5):c.rect(o.x-9,o.y-13,18,26);c.fill();E(c,o.x,o.y+14,3,4,'#ffe9a0');c.globalAlpha=1}
  if(started&&(me.a==='k'||Object.values(remote).some(p=>p&&p.h&&p.a==='k'))){
    c.fillStyle='rgba(30,8,4,.8)';c.fillRect(60,6,640,42);c.strokeStyle='#d9a931';c.lineWidth=1.5;c.strokeRect(60,6,640,42);
    c.fillStyle='#ffe9a8';c.font='bold 21px '+FONT;c.textAlign='center';c.fillText(KINH[Math.floor(Date.now()/3600)%KINH.length],CX,34)}
}
requestAnimationFrame(frame);

/* ---------- cúng dường: thắp hương, dâng hoa, dâng đèn, lạy Phật, thả đèn ---------- */
const EV={huong:'thắp một nén hương',hoa:'dâng một đóa sen',den:'dâng một ngọn đèn',lay:'lạy Phật',tha:'thả một chiếc đèn trời'};
function feed(m){const f=$('feed'),d=document.createElement('div');d.textContent=m;f.append(d);while(f.children.length>4)f.firstChild.remove();setTimeout(()=>d.remove(),8000)}
function ev(k,n){feed(n+' · '+EV[k]);const t=now();
  if(k==='huong'){inc.push({t,x:CX+((incN++%9)-4)*8});tone(660,.6,.08)}
  if(k==='hoa'){fl.push({t,x:CX+((flN++%10)-4.5)*58});tone(880,.4,.06)}
  if(k==='den'){lm.push({t,x:CX+((lmN++%12)-5.5)*50});tone(990,.3,.06)}
  if(k==='lay'){bows[n]=t+1.6;mo(.15)}
  if(k==='tha'){sky.push({x:120+Math.random()*520,y:H-40,t});tone(520,.8,.06)}
  [inc,fl,lm].forEach(a=>{while(a.length&&t-a[0].t>90)a.shift()});
}
const COOL={};
function act(k){if(!started)return;const t=Date.now();if(t-(COOL[k]||0)<700)return;COOL[k]=t;
  if(me.h){ev(k,me.n);bcast({t:'e',k,n:me.n})}else if(hostConn&&hostConn.open)hostConn.send({t:'e',k});else ev(k,me.n)}
[['huong','🔥 Thắp hương'],['hoa','🪷 Dâng hoa'],['den','🕯️ Dâng đèn'],['lay','🙇 Lạy Phật'],['tha','🏮 Thả đèn']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>act(k);$('bar').append(b)});

/* ---------- chọn chỗ ngồi ---------- */
function lp(e){const r=cv.getBoundingClientRect();return[((e.clientX-r.left)*dpr-ox)/sc,((e.clientY-r.top)*dpr-oy)/sc]}
function seatAt(px,py){let b=-1,bd=1e9;S.forEach((q,i)=>{const dx=Math.abs(px-q.x),dy=py-q.y;if(dx<32*q.s&&dy>-66*q.s&&dy<16*q.s){const d=dx+Math.abs(dy+20*q.s);if(d<=bd){bd=d;b=i}}});return b}
function sit(i){
  if(i===0&&!me.h)return toast('Đây là tòa của Sư trụ trì');
  if(taken(i))return toast('Chỗ này đã có người ngồi');
  me.s=i===me.s?-1:i;
}
cv.onpointermove=e=>{const [x,y]=lp(e);hover=seatAt(x,y);cv.style.cursor=hover>=0?'pointer':'default'};
cv.onpointerleave=()=>hover=-1;
cv.onclick=e=>{if(!started)return;const [x,y]=lp(e),i=seatAt(x,y);if(i>=0)sit(i)};
function tg(a){me.a=me.a===a?'':a;$('bn').classList.toggle('on',me.a==='n');$('bk').classList.toggle('on',me.a==='k')}
$('bn').onclick=()=>tg('n');$('bk').onclick=()=>tg('k');$('bb').onclick=bell;$('bu').onclick=()=>{me.s=-1};
$('bs').onclick=()=>{for(let i=me.h?0:1;i<S.length;i++)if(!taken(i)&&i!==me.s){me.s=i;return}toast('Chùa đã kín chỗ')};
$('bt').onclick=()=>$('side').classList.add('open');$('bx').onclick=()=>$('side').classList.remove('open');

/* ---------- chuỗi hạt ---------- */
const sv=$('sv');let HB='';
for(let i=0;i<27;i++){const a=i/27*2*Math.PI;HB+=`<circle cx="${(60+46*Math.sin(a)).toFixed(1)}" cy="${(60-46*Math.cos(a)).toFixed(1)}" r="${i?6:8}" fill="${i?'#8a4b1f':'#c0392b'}" stroke="#e8c36a"/>`}
sv.innerHTML=`<g id="mg">${HB}</g>`;
let ang=0,acc=0,dr=false,la=0,mvd=0;
const pa=e=>{const r=sv.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI};
function spin(d){ang+=d;acc+=Math.abs(d);$('mg').setAttribute('transform',`rotate(${ang.toFixed(1)} 60 60)`);while(acc>=STEP){acc-=STEP;me.b++;tk();$('cnt').textContent=me.b;if(me.b%108===0){bell();toast('Đủ 108 hạt 🙏')}}}

/* ---------- chat ---------- */
function addMsg(n,m,k){
  const d=document.createElement('div');if(k==='sys'){d.className='sys';d.textContent=m}
  else{const b=document.createElement('b');b.textContent=n+': ';if(k==='h')b.className='h';d.append(b,document.createTextNode(m))}
  const box=$('msgs');box.append(d);box.scrollTop=box.scrollHeight;while(box.children.length>150)box.firstChild.remove();
}
const bcast=o=>conns.forEach(c=>c.open&&c.send(o));
function sys(m){addMsg('',m,'sys');bcast({t:'c',m,k:'sys'})}
let lastSend=0;
function send(){
  const m=$('ci').value.trim().slice(0,200);if(!m||!started||Date.now()-lastSend<400)return;lastSend=Date.now();$('ci').value='';
  if(me.h){addMsg(me.n,m,'h');bcast({t:'c',n:me.n,m,k:'h'})}
  else if(hostConn&&hostConn.open)hostConn.send({t:'c',m});
  else addMsg(me.n,m);
}
$('cs').onclick=send;$('ci').onkeydown=e=>{if(e.key==='Enter')send()};

/* ---------- mạng (PeerJS, không cần máy chủ riêng) ---------- */
function roomUI(c){
  const link=location.origin+location.pathname+'?phong='+c;
  $('room').innerHTML='🏯 <b>Chùa Online</b>'+(c?'<br>Mã phòng: <b>'+esc(c)+'</b> <button id="cp" style="padding:3px 8px">Sao chép link mời</button>':'')+'<br><small>Chạm vào bồ đoàn để ngồi, rồi cúng dường bên dưới</small>';
  if(c)$('cp').onclick=()=>navigator.clipboard.writeText(link).then(()=>toast('Đã sao chép link mời'));
}
function startHost(){
  const c=Math.random().toString(36).slice(2,7);peer=new Peer('chuaol-'+c);
  peer.on('open',()=>roomUI(c));
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();startHost()}else toast('Chưa kết nối được mạng, bạn đang ở một mình')});
  peer.on('connection',cn=>{conns.push(cn);
    cn.on('data',d=>{if(!d)return;if(d.t==='e'&&EV[d.k]){const n=remote[cn.peer]?String(remote[cn.peer].n).slice(0,20):'Khách';ev(d.k,n);bcast({t:'e',k:d.k,n});return}
      if(d.t==='m'&&d.p){if(!remote[cn.peer])sys(String(d.p.n).slice(0,20)+' đã vào chùa');remote[cn.peer]=d.p}
      else if(d.t==='c'&&typeof d.m==='string'){const n=remote[cn.peer]?String(remote[cn.peer].n).slice(0,20):'Khách',m=d.m.slice(0,200);addMsg(n,m);bcast({t:'c',n,m})}});
    cn.on('close',()=>{if(remote[cn.peer])sys(String(remote[cn.peer].n).slice(0,20)+' đã rời chùa');delete remote[cn.peer];conns=conns.filter(x=>x!==cn)})});
}
function join(c){
  peer=new Peer();
  peer.on('open',id=>{myId=id;hostConn=peer.connect('chuaol-'+c,{reliable:true});
    hostConn.on('open',()=>toast('Đã vào chùa'));
    hostConn.on('data',d=>{if(!d)return;if(d.t==='e'&&EV[d.k]){ev(d.k,String(d.n||'').slice(0,20));return}if(d.t==='s'&&d.p){remote=d.p;delete remote[myId]}else if(d.t==='c'&&typeof d.m==='string')addMsg(String(d.n||'').slice(0,20),d.m.slice(0,200),d.k==='sys'||d.k==='h'?d.k:'')});
    hostConn.on('close',()=>{remote={};toast('Sư trụ trì đã đóng cửa chùa')})});
  peer.on('error',()=>toast('Không tìm thấy phòng. Kiểm tra lại mã phòng.'));
}
function net(){
  if(me.h)bcast({t:'s',p:Object.assign({},remote,{host:pub()})});
  else if(hostConn&&hostConn.open)hostConn.send({t:'m',p:pub()});
}

/* ---------- vào chùa ---------- */
const qs=new URLSearchParams(location.search).get('phong');if(qs)$('rc').value=qs;
function enter(h){
  const n=$('nm').value.trim().slice(0,20);if(!n){$('nm').focus();return}
  const rc=$('rc').value.trim().toLowerCase();if(!h&&!rc){$('rc').focus();toast('Nhập mã phòng để vào chùa');return}
  me.n=n;me.h=h;AC.resume();$('login').hidden=true;started=true;
  if(h){me.s=0;addMsg('','Bạn là Sư trụ trì. Gửi link mời để mọi người cùng vào chùa.','sys')}
  else addMsg('','Chọn một bồ đoàn để ngồi, rồi niệm Phật hoặc tụng kinh cùng mọi người.','sys');
  roomUI('');
  try{h?startHost():join(rc)}catch(e){toast('Không kết nối được mạng')}
  setInterval(net,150);
  setInterval(()=>{const a=[me].concat(Object.values(remote).filter(Boolean));$('n2').textContent=a.length;$('names').textContent=a.map(p=>(p.h?'🙏 ':'')+String(p.n).slice(0,20)).join(', ')},1000);
}
$('bh').onclick=()=>enter(true);$('bj').onclick=()=>enter(false);
